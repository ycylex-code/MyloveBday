<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--x:50%;--y:15%}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px;color:#fff6ef;background:radial-gradient(circle at var(--x) var(--y),#ff8eaa 0,#a23c68 18%,#501c4b 46%,#19071e 76%);font-family:"DM Mono",monospace;overflow:hidden;transition:background .16s ease-out}body::before,body::after{content:"♥";position:fixed;pointer-events:none;font-family:"Playfair Display",serif;color:#ffb8ca18;font-size:min(36vw,420px);line-height:1;z-index:-1;filter:blur(.4px);animation:loveFloat 12s ease-in-out infinite alternate}body::before{left:-5vw;bottom:-14vw;transform:rotate(-18deg)}body::after{right:-6vw;top:-14vw;transform:rotate(22deg);animation-delay:-5s}@keyframes loveFloat{to{transform:translateY(-25px) rotate(8deg) scale(1.06)}}.hearts,.hearts::before,.hearts::after{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(#ffe4e9 1px,transparent 2px),radial-gradient(#ffadc2 1px,transparent 2px),radial-gradient(#ffd787 1px,transparent 2px);background-size:70px 70px,123px 123px,179px 179px;opacity:.44;animation:drift 20s linear infinite}.hearts::before{transform:rotate(25deg);opacity:.2;animation-duration:27s}@keyframes drift{to{background-position:90px 120px,160px 184px,210px 250px}}.layout{width:min(1180px,100%);min-height:590px;display:grid;grid-template-columns:minmax(380px,.9fr) minmax(500px,1.25fr);overflow:hidden;border-radius:34px;border:1px solid #ffe7d466;background:linear-gradient(120deg,#fff5f014,#ffffff08);box-shadow:0 30px 100px #17000d99,0 0 90px #ff759a32;backdrop-filter:blur(14px);position:relative}.layout::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px #fff5ef66}.copy{padding:clamp(45px,6vw,78px) clamp(32px,5vw,70px);text-align:left;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:10px;letter-spacing:.16em;color:#ffd0da}p{color:#ffe6d9;line-height:1.8}h1{font:500 clamp(42px,6vw,72px)/.95 "Playfair Display",serif;margin:18px 0 23px;letter-spacing:-.055em}h1 em{color:#ffd09a}.back{display:inline-block;align-self:flex-start;margin-top:22px;color:#421126;background:linear-gradient(100deg,#ffe8d3,#ffb2c5);padding:14px 18px;border-radius:99px;text-decoration:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;transition:.2s;box-shadow:0 8px 24px #ff7f9a44}.back:hover{transform:translateY(-3px);box-shadow:0 13px 28px #ff7f9a6b}.photo-side{min-height:590px;position:relative;background:linear-gradient(145deg,#9d3b65,#4d183f);padding:18px}.photo-side img{width:100%;height:100%;position:absolute;object-fit:cover;inset:0;padding:18px;filter:saturate(1.02) sepia(.1);border-radius:28px}.photo-side::after{content:"a favorite memory";position:absolute;left:18px;right:18px;bottom:18px;padding:90px 22px 23px;background:linear-gradient(transparent,#2e0b26e8);border-radius:0 0 17px 17px;font:italic 28px "Playfair Display",serif;text-align:center;color:#fff1e8;text-shadow:0 2px 13px #250516}.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:#ffe0a3;box-shadow:0 0 16px 6px #ff89a488;pointer-events:none;animation:spark .8s ease-out forwards}@keyframes spark{to{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}}@media(max-width:850px){.layout{grid-template-columns:1fr;max-width:620px}.photo-side{min-height:440px;order:-1}.copy{text-align:center}.back{align-self:center}}@media(max-width:500px){body{padding:16px}.photo-side{min-height:330px;padding:12px}.photo-side img{padding:12px}.photo-side::after{left:12px;right:12px;bottom:12px}}
  </style>
</head>
<body><div class="hearts"></div><main class="layout"><section class="copy"><p class="eyebrow">✦ THE NEXT LITTLE SURPRISE ✦</p><h1>A whole year of <em>possibility.</em></h1><p>May the next twelve months be filled with beautiful stories, quiet victories, and more moments that make you smile without even trying.</p><p>Never forget how loved you are.</p><a class="back" href="index.html">← Return to your card</a></section><section class="photo-side"><img src="lovelove.jpg" alt="A special memory" onerror="this.style.display='none'"></section></main><script>window.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--x',e.clientX/innerWidth*100+'%');document.documentElement.style.setProperty('--y',e.clientY/innerHeight*100+'%')});window.addEventListener('click',e=>{if(e.target.closest('a'))return;for(let i=0;i<6;i++){let s=document.createElement('i');s.className='spark';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--sx',(Math.random()-.5)*130+'px');s.style.setProperty('--sy',(Math.random()-.5)*130+'px');document.body.append(s);s.addEventListener('animationend',()=>s.remove())}})</script></body>
</html>
